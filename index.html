<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Classement UEFA par pays</title>
<style>
:root {
  --bg: #0c1520;
  --surface: #14202e;
  --surface-alt: #1a2a3a;
  --surface-hover: #1f3145;
  --accent: #00e676;
  --accent-dim: rgba(0, 230, 118, 0.15);
  --accent-soft: rgba(0, 230, 118, 0.08);
  --live: #4da3ff;
  --live-dim: rgba(77, 163, 255, 0.13);
  --text: #e4eaf0;
  --text-secondary: #8fa4b8;
  --text-faint: #5e7285;
  --border: #1e3347;
  --border-soft: rgba(255, 255, 255, 0.05);
  --gold: #ffd700;
  --silver: #c0c0c0;
  --bronze: #cd7f32;
  --bar: rgba(0, 230, 118, 0.16);
  --shadow: 0 1px 3px rgba(0, 0, 0, 0.4);
}
@media (prefers-color-scheme: light) {
  :root {
    --bg: #f3f5f8;
    --surface: #ffffff;
    --surface-alt: #eef2f6;
    --surface-hover: #e7edf4;
    --accent: #00894a;
    --accent-dim: rgba(0, 137, 74, 0.12);
    --accent-soft: rgba(0, 137, 74, 0.06);
    --live: #1668c4;
    --live-dim: rgba(22, 104, 196, 0.09);
    --text: #1a2533;
    --text-secondary: #5e7285;
    --text-faint: #8b9cad;
    --border: #dde4ec;
    --border-soft: rgba(0, 0, 0, 0.05);
    --bar: rgba(0, 137, 74, 0.14);
    --shadow: 0 1px 3px rgba(20, 40, 70, 0.09);
  }
}
:root[data-theme="light"] {
  --bg: #f3f5f8; --surface: #ffffff; --surface-alt: #eef2f6; --surface-hover: #e7edf4;
  --accent: #00894a; --accent-dim: rgba(0,137,74,.12); --accent-soft: rgba(0,137,74,.06);
  --live: #1668c4; --live-dim: rgba(22,104,196,.09);
  --text: #1a2533; --text-secondary: #5e7285; --text-faint: #8b9cad;
  --border: #dde4ec; --border-soft: rgba(0,0,0,.05); --bar: rgba(0,137,74,.14);
  --shadow: 0 1px 3px rgba(20,40,70,.09);
}
:root[data-theme="dark"] {
  --bg: #0c1520; --surface: #14202e; --surface-alt: #1a2a3a; --surface-hover: #1f3145;
  --accent: #00e676; --accent-dim: rgba(0,230,118,.15); --accent-soft: rgba(0,230,118,.08);
  --live: #4da3ff; --live-dim: rgba(77,163,255,.13);
  --text: #e4eaf0; --text-secondary: #8fa4b8; --text-faint: #5e7285;
  --border: #1e3347; --border-soft: rgba(255,255,255,.05); --bar: rgba(0,230,118,.16);
  --shadow: 0 1px 3px rgba(0,0,0,.4);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  font-variant-numeric: tabular-nums;
}

.widget { max-width: 1080px; margin: 0 auto; padding: 20px 14px 36px; }

/* ── En-tête ─────────────────────────────────────────────────────── */

.head { margin-bottom: 18px; }
.eyebrow {
  display: inline-flex; align-items: center; gap: 7px;
  font-size: 11px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase;
  color: var(--accent); background: var(--accent-dim);
  padding: 4px 10px; border-radius: 999px; margin-bottom: 10px;
}
.eyebrow .dot {
  width: 6px; height: 6px; border-radius: 50%; background: var(--accent);
  animation: pulse 2.4s ease-in-out infinite;
}
@keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .35 } }
@media (prefers-reduced-motion: reduce) { .eyebrow .dot { animation: none } }

h1 { font-size: clamp(21px, 4.4vw, 30px); font-weight: 800; letter-spacing: -.02em; }
.sub { color: var(--text-secondary); font-size: 14px; margin-top: 6px; max-width: 66ch; }
.sub b { color: var(--text); font-weight: 600; }

/* ── Barre d'outils ──────────────────────────────────────────────── */

.tools {
  display: flex; flex-wrap: wrap; gap: 9px; align-items: center;
  margin: 16px 0 12px;
}
.search {
  flex: 1 1 190px; min-width: 150px; position: relative;
}
.search input {
  width: 100%; font: inherit; font-size: 14px;
  color: var(--text); background: var(--surface); border: 1px solid var(--border);
  border-radius: 9px; padding: 9px 12px 9px 33px; outline: none;
  transition: border-color .15s, box-shadow .15s;
}
.search input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.search svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); opacity: .45; }

.seg { display: flex; background: var(--surface); border: 1px solid var(--border); border-radius: 9px; padding: 2px; }
.seg button {
  font: inherit; font-size: 12.5px; font-weight: 600; color: var(--text-secondary);
  background: none; border: 0; border-radius: 7px; padding: 6px 11px; cursor: pointer;
  transition: background .15s, color .15s; white-space: nowrap;
}
.seg button[aria-pressed="true"] { background: var(--accent-dim); color: var(--accent); }
.seg button:hover:not([aria-pressed="true"]) { color: var(--text); }

/* ── Tableau ─────────────────────────────────────────────────────── */

.card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 13px; overflow: hidden; box-shadow: var(--shadow);
}
.scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }

table { width: 100%; border-collapse: collapse; font-size: 14px; }

thead th {
  position: sticky; top: 0; z-index: 3;
  background: var(--surface-alt);
  font-size: 10.5px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase;
  color: var(--text-secondary); text-align: right;
  padding: 10px 7px; white-space: nowrap;
  border-bottom: 1px solid var(--border);
}
thead th:first-child, thead th.assoc { text-align: left; }
/* Sans ces largeurs, la colonne des associations absorbe tout l'espace libre
   et écrase les colonnes de chiffres. Réservé aux écrans larges : en dessous
   de 500 px le tableau passe en `table-layout: fixed` avec ses propres
   largeurs, et les deux jeux de règles se contrarieraient. */
@media (min-width: 501px) {
  .card thead th.season { width: 11%; }
  .card thead th.total { width: 14.5%; }
  .card thead th.clubs { width: 9%; }
}
thead th.sortable { cursor: pointer; user-select: none; transition: color .15s; }
thead th.sortable:hover { color: var(--text); }
thead th .arrow { opacity: 0; font-size: 9px; margin-left: 3px; }
thead th[data-active] { color: var(--accent); }
thead th[data-active] .arrow { opacity: 1; }
thead th.col-live { color: var(--live); }

tbody tr.row { border-bottom: 1px solid var(--border-soft); cursor: pointer; transition: background .12s; }
tbody tr.row:hover { background: var(--surface-hover); }
tbody tr.row.open { background: var(--surface-hover); }
tbody td { padding: 9px 7px; text-align: right; white-space: nowrap; }

.rk {
  width: 46px; text-align: left !important;
  font-weight: 700; font-size: 13px; color: var(--text-faint);
}
.rk .n {
  display: inline-flex; align-items: center; justify-content: center;
  min-width: 23px; height: 23px; border-radius: 6px; padding: 0 5px;
  background: var(--surface-alt); color: var(--text-secondary);
}
tr.t1 .rk .n { background: rgba(255,215,0,.16); color: var(--gold); }
tr.t2 .rk .n, tr.t3 .rk .n, tr.t4 .rk .n, tr.t5 .rk .n { background: var(--accent-dim); color: var(--accent); }

td.assoc { text-align: left !important; min-width: 150px; }
.who { display: flex; align-items: center; gap: 9px; min-width: 0; }
.who > span:last-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.who img {
  width: 22px; height: 15px; object-fit: cover; border-radius: 2.5px;
  background: var(--surface-alt); flex-shrink: 0;
}
.who .nm { font-weight: 600; }
.who .cd { font-size: 10.5px; font-weight: 700; color: var(--text-faint); letter-spacing: .04em; }
.chev { color: var(--text-faint); font-size: 10px; transition: transform .18s; display: inline-block; }
tr.open .chev { transform: rotate(90deg); color: var(--accent); }

td.season { color: var(--text-secondary); font-size: 13px; }
td.season.live { color: var(--live); font-weight: 600; background: var(--live-dim); }
th.col-live { background: var(--surface-alt); }

/* L'intitulé « Total 5 saisons » se met sur deux lignes quand la colonne
   se resserre, plutôt que d'élargir tout le tableau. */
thead th.total { white-space: normal; line-height: 1.25; }
td.total { font-weight: 800; font-size: 14.5px; position: relative; padding-right: 12px; }
td.total .barwrap {
  position: absolute; inset: 4px 6px 4px 6px; border-radius: 5px; overflow: hidden; z-index: 0;
}
td.total .bar { position: absolute; inset: 0 auto 0 0; background: var(--bar); border-radius: 5px; }
td.total .v { position: relative; z-index: 1; }

td.clubs { font-size: 12px; color: var(--text-secondary); }
td.clubs .on { color: var(--accent); font-weight: 700; }

/* ── Panneau de détail ───────────────────────────────────────────── */

tr.detail > td { padding: 0; background: var(--bg); }
.panel { padding: 12px 14px 15px; border-bottom: 1px solid var(--border); }
.panel h3 {
  font-size: 11px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase;
  color: var(--text-secondary); margin-bottom: 9px;
}
.panel h3 span { color: var(--live); }
.clubtable { width: 100%; font-size: 13px; border-collapse: collapse; table-layout: auto; }
/* Détail du club rappelé sous son nom quand les colonnes de chiffres
   intermédiaires disparaissent (mobile). */
.c-meta { display: none; }
.clubtable th {
  font-size: 10px; text-transform: uppercase; letter-spacing: .05em; font-weight: 700;
  color: var(--text-faint); text-align: right; padding: 4px 7px; border-bottom: 1px solid var(--border-soft);
  position: static; background: none;
}
.clubtable th:first-child { text-align: left; }
.clubtable td { padding: 5px 7px; text-align: right; border-bottom: 1px solid var(--border-soft); }
.clubtable td:first-child { text-align: left; font-weight: 500; }
.clubtable tr:last-child td { border-bottom: 0; }
.clubtable .cpts { font-weight: 700; }
.clubtable .waiting { color: var(--text-faint); font-style: italic; }
.tag {
  display: inline-block; font-size: 9.5px; font-weight: 700; letter-spacing: .04em;
  padding: 1.5px 5px; border-radius: 4px; margin-left: 6px; vertical-align: 1px;
}
.tag.UCL { background: rgba(77,163,255,.16); color: var(--live); }
.tag.UEL { background: rgba(255,153,0,.16); color: #ff9f2e; }
.tag.UECL { background: rgba(0,230,118,.14); color: var(--accent); }
.tag.out { background: var(--surface-alt); color: var(--text-faint); }
.clubtable tr.out td:first-child, .clubtable tr.out td { color: var(--text-faint); }
@media (prefers-color-scheme: light) { .tag.UEL { color: #b26b00 } }

.sumline {
  display: flex; flex-wrap: wrap; gap: 14px; margin-top: 10px; padding-top: 9px;
  border-top: 1px solid var(--border-soft); font-size: 12px; color: var(--text-secondary);
}
.sumline b { color: var(--text); font-weight: 700; }

/* ── Pied ────────────────────────────────────────────────────────── */

.foot { margin-top: 14px; font-size: 11.5px; color: var(--text-faint); line-height: 1.6; }
.foot b { color: var(--text-secondary); font-weight: 600; }
.legend { display: flex; flex-wrap: wrap; gap: 13px; margin-bottom: 7px; }
.legend i { display: inline-block; width: 9px; height: 9px; border-radius: 3px; margin-right: 5px; vertical-align: 0; }

.empty { padding: 34px 16px; text-align: center; color: var(--text-secondary); font-size: 14px; }

/* ── Compact : on masque les saisons les plus anciennes ──────────── */

/* Les cinq saisons tiennent de front dès ~620 px. En dessous, elles
   s'effacent une à une, la plus ancienne d'abord. */
@media (max-width: 820px) {
  .widget { padding: 16px 10px 30px; }
  table { font-size: 13px; }
  tbody td, thead th { padding: 8px 6px; }
  td.assoc { min-width: 124px; }
  .who .cd { display: none; }
}
@media (max-width: 660px) { .hideable-1 { display: none } }
@media (max-width: 560px) { .hideable-2 { display: none } }
@media (max-width: 500px) {
  .hideable-3 { display: none }
  .who img { width: 19px; height: 13px }
  .who { gap: 7px }
  /* Sur les écrans les plus étroits, la saison en cours et le total doivent
     rester lisibles sans défilement. C'est l'intitulé « Association » qui
     imposait jusqu'ici la largeur de la colonne. */
  /* Mise en page automatique : avec des intitulés courts (« 26/27 ») tout
     tient sans défilement. Un `table-layout: fixed` réserverait au contraire
     de la place pour les colonnes masquées. */
  td.assoc, thead th.assoc { min-width: 0; }
  thead th.assoc { letter-spacing: 0; font-size: 9.5px; }
  td.total { font-size: 13.5px; padding-right: 9px; }
  .rk { width: 34px }
  .rk .n { min-width: 20px; height: 20px; font-size: 12px }
}
@media (max-width: 420px) { .hideable-4 { display: none } }

/* Tableau de détail : sur mobile on ne garde que le club et son total, les
   chiffres intermédiaires passent en sous-titre. */
@media (max-width: 560px) {
  .clubtable .c-matches, .clubtable .c-mpts, .clubtable .c-bonus { display: none; }
  .clubtable td:first-child { white-space: normal; }
  .c-meta {
    display: block; font-size: 11px; color: var(--text-faint);
    font-weight: 400; margin-top: 1px;
  }
  .panel { padding: 10px 10px 13px; }
  .clubtable th, .clubtable td { padding: 6px 5px; }
  .clubtable td.cpts { font-size: 14px; }
  .sumline { gap: 10px; font-size: 11.5px; }
}
</style>
</head>
<body>
<div class="widget">
  <div class="head">
    <div class="eyebrow"><span class="dot"></span><span id="eyebrow">Saison en cours</span></div>
    <h1 id="title">Classement UEFA par pays</h1>
    <p class="sub" id="sub"></p>
  </div>

  <div class="tools">
    <div class="search">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Rechercher un pays…" autocomplete="off" aria-label="Rechercher un pays">
    </div>
    <div class="seg" role="group" aria-label="Affichage">
      <button id="btn-all" aria-pressed="true">Toutes les associations</button>
      <button id="btn-top" aria-pressed="false">Top 20</button>
    </div>
  </div>

  <div class="card">
    <div class="scroll">
      <table>
        <thead><tr id="thead"></tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </div>

  <div class="foot">
    <div class="legend">
      <span><i style="background:rgba(255,215,0,.5)"></i>1<sup>er</sup></span>
      <span><i style="background:var(--accent)"></i>Top 5</span>
      <span><i style="background:var(--live)"></i>Saison en cours, recalculée en direct</span>
    </div>
    <div id="method"></div>
  </div>
</div>

<script>
const F3 = (v) => (v || 0).toFixed(3);
// Prose : « 2022-23 ». En-tête de colonne : « 22/23 », pour tenir les cinq
// saisons de front sans élargir le tableau.
const FR = (s) => s.replace("/", "-");
const SEA = (s) => s.slice(2);

let DATA = null;
let sortKey = "total";
let sortDir = -1;
let openCode = null;
let topOnly = false;

/* Colonnes : les saisons closes sont masquées en premier sur petit écran,
   la plus ancienne d'abord. */
function columns() {
  // La saison en cours et le total restent toujours visibles. Les saisons
  // closes s'effacent au fur et à mesure, la plus ancienne d'abord.
  const closed = DATA.seasons.filter((s) => s !== DATA.liveSeason);
  const steps = ["hideable-1", "hideable-1", "hideable-2", "hideable-3"];
  const hideOf = new Map(
    closed.map((s, i) => [s, steps[Math.min(i, steps.length - 1)]])
  );

  const cols = [
    { key: "rank", label: "#", cls: "rk", sortable: false },
    { key: "name", label: "Association", cls: "assoc", sortable: true },
  ];
  for (const s of DATA.seasons) {
    const live = s === DATA.liveSeason;
    const hide = live ? "" : hideOf.get(s) || "";
    cols.push({
      key: "s:" + s,
      label: SEA(s),
      cls: "season" + (live ? " live" : ""),
      thCls: live ? "col-live" : hide,
      hide,
      sortable: true,
    });
  }
  cols.push({ key: "total", label: "Total 5 saisons", cls: "total", sortable: true });
  cols.push({
    key: "clubsAlive",
    label: "Clubs",
    cls: "clubs",
    thCls: "hideable-4",
    hide: "hideable-4",
    title: "Clubs encore en lice sur clubs engagés",
    sortable: true,
  });
  return cols;
}

function valueOf(row, key) {
  if (key === "name") return row.name;
  if (key.startsWith("s:")) return row.coefs[key.slice(2)] || 0;
  return row[key] ?? 0;
}

function sorted() {
  const rows = DATA.rows.filter((r) => {
    const q = document.getElementById("q").value.trim().toLowerCase();
    return !q || r.name.toLowerCase().includes(q) || r.code.toLowerCase().includes(q);
  });
  rows.sort((a, b) => {
    const x = valueOf(a, sortKey), y = valueOf(b, sortKey);
    const c = typeof x === "string" ? x.localeCompare(y, "fr") * -1 : x - y;
    return c * sortDir || a.rank - b.rank;
  });
  return topOnly ? rows.filter((r) => r.rank <= 20) : rows;
}

function renderHead() {
  const tr = document.getElementById("thead");
  tr.innerHTML = "";
  for (const c of columns()) {
    const th = document.createElement("th");
    th.className = [c.cls.split(" ")[0] === "rk" ? "" : c.cls.split(" ")[0], c.thCls || ""].filter(Boolean).join(" ");
    if (c.cls.startsWith("assoc")) th.classList.add("assoc");
    th.textContent = c.label;
    if (c.title) th.title = c.title;
    if (c.sortable) {
      th.classList.add("sortable");
      th.tabIndex = 0;
      th.setAttribute("role", "button");
      if (sortKey === c.key) th.dataset.active = "1";
      const a = document.createElement("span");
      a.className = "arrow";
      a.textContent = sortDir === -1 ? "▼" : "▲";
      th.appendChild(a);
      const go = () => {
        if (sortKey === c.key) sortDir *= -1;
        else { sortKey = c.key; sortDir = c.key === "name" ? 1 : -1; }
        render();
      };
      th.addEventListener("click", go);
      th.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); go(); } });
    }
    tr.appendChild(th);
  }
}

function clubRows(row) {
  if (!row.detail.length) return '<tr><td colspan="5" class="waiting">Aucun club engagé cette saison.</td></tr>';
  return row.detail
    .map((c) => {
      const notStarted = c.played === 0;
      const mpts = notStarted ? "—" : F3(c.matchPts).replace(/\.?0+$/, "") || "0";
      const bonus = c.bonus ? F3(c.bonus).replace(/\.?0+$/, "") : "—";
      // Sur mobile seules les colonnes Club et Total restent : le reste est
      // rappelé en petit sous le nom du club.
      const meta = notStarted
        ? "encore qualifié"
        : `${c.played} match${c.played > 1 ? "es" : ""} · ${mpts} pt${Number(mpts) > 1 ? "s" : ""}` +
          (c.bonus ? ` · bonus ${bonus}` : "");
      return `<tr${c.alive ? "" : ' class="out"'}>
        <td>${esc(c.name)}${c.comp ? `<span class="tag ${c.comp.split("+")[0]}">${c.comp}</span>` : ""}${
        c.alive ? "" : '<span class="tag out">éliminé</span>'
      }<span class="c-meta">${meta}</span></td>
        <td class="c-matches">${notStarted ? '<span class="waiting">encore qualifié</span>' : c.played}</td>
        <td class="c-mpts">${mpts}</td>
        <td class="c-bonus">${bonus}</td>
        <td class="cpts">${F3(c.pts).replace(/\.?0+$/, "") || "0"}</td>
      </tr>`;
    })
    .join("");
}

function esc(s) {
  return String(s).replace(/[&<>"]/g, (m) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[m]));
}

function render() {
  renderHead();
  const cols = columns();
  const tb = document.getElementById("tbody");
  const rows = sorted();
  const max = Math.max(...DATA.rows.map((r) => r.total), 1);
  tb.innerHTML = "";

  if (!rows.length) {
    tb.innerHTML = `<tr><td colspan="${cols.length}" class="empty">Aucune association ne correspond à cette recherche.</td></tr>`;
    return;
  }

  for (const row of rows) {
    const tr = document.createElement("tr");
    tr.className = "row" + (row.rank <= 5 ? " t" + row.rank : "") + (openCode === row.code ? " open" : "");
    tr.tabIndex = 0;
    tr.setAttribute("role", "button");
    tr.setAttribute("aria-expanded", openCode === row.code ? "true" : "false");

    let html = "";
    for (const c of cols) {
      const hide = c.hide ? " " + c.hide : "";
      if (c.key === "rank") {
        html += `<td class="rk${hide}"><span class="n">${row.rank}</span></td>`;
      } else if (c.key === "name") {
        html += `<td class="assoc${hide}"><div class="who">
          <span class="chev">▶</span>
          <img src="${row.flag}" alt="" loading="lazy" width="22" height="15">
          <span><span class="nm">${esc(row.name)}</span> <span class="cd">${row.code}</span></span>
        </div></td>`;
      } else if (c.key.startsWith("s:")) {
        const s = c.key.slice(2);
        const live = s === DATA.liveSeason;
        html += `<td class="season${live ? " live" : ""}${hide}">${F3(row.coefs[s])}</td>`;
      } else if (c.key === "total") {
        const pct = (row.total / max) * 100;
        html += `<td class="total${hide}"><span class="barwrap"><span class="bar" style="width:${pct.toFixed(1)}%"></span></span><span class="v">${F3(row.total)}</span></td>`;
      } else {
        html += `<td class="clubs${hide}"><span class="on">${row.clubsAlive}</span>/${row.clubs}</td>`;
      }
    }
    tr.innerHTML = html;

    const toggle = () => {
      openCode = openCode === row.code ? null : row.code;
      render();
    };
    tr.addEventListener("click", toggle);
    tr.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggle(); } });
    tb.appendChild(tr);

    if (openCode === row.code) {
      const d = document.createElement("tr");
      d.className = "detail";
      const live = row.coefs[DATA.liveSeason] || 0;
      const pts = row.detail.reduce((s, c) => s + c.pts, 0);
      d.innerHTML = `<td colspan="${cols.length}"><div class="panel">
        <h3>Détail <span>${FR(DATA.liveSeason)}</span> — ${esc(row.name)}</h3>
        <table class="clubtable">
          <thead><tr><th>Club</th><th class="c-matches">Matches</th><th class="c-mpts">Pts matches</th><th class="c-bonus">Bonus</th><th>Total</th></tr></thead>
          <tbody>${clubRows(row)}</tbody>
        </table>
        <div class="sumline">
          <span>Total des points : <b>${F3(pts).replace(/\.?0+$/, "") || "0"}</b></span>
          <span>Clubs engagés : <b>${row.clubs}</b></span>
          <span>Coefficient ${FR(DATA.liveSeason)} : <b>${F3(live)}</b></span>
        </div>
      </div></td>`;
      tb.appendChild(d);
    }
  }
}

function renderHeader() {
  const first = DATA.seasons[0], last = DATA.liveSeason;
  document.getElementById("eyebrow").textContent = `Saison ${FR(last)} en cours`;
  document.getElementById("title").textContent = `Classement UEFA par pays ${DATA.rankingYear}`;
  document.getElementById("sub").innerHTML =
    `Performance des clubs de chaque association en Ligue des champions, Ligue Europa et Ligue Conference ` +
    `sur cinq saisons, de <b>${FR(first)}</b> à <b>${FR(last)}</b>. Ce classement fixe le nombre de places ` +
    `attribuées à chaque pays pour la saison <b>${FR(DATA.allocationSeason)}</b>.`;

  const d = new Date(DATA.updated);
  const stamp = d.toLocaleDateString("fr-FR", { day: "numeric", month: "long", year: "numeric" }) +
    " à " + d.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });
  document.getElementById("method").innerHTML =
    `<b>Calcul :</b> 2 points par victoire et 1 par match nul (moitié en phase de qualification et en barrages d'été), ` +
    `plus les bonus UEFA de classement en phase de ligue et de tour atteint à partir des huitièmes. ` +
    `Le total est divisé par le nombre de clubs engagés, puis tronqué à trois décimales. ` +
    `Les tirs au but ne rapportent aucun point, mais la qualification qu'ils procurent ouvre droit au bonus de tour.<br>` +
    `<b>Colonne Clubs :</b> clubs encore en lice sur clubs engagés. Un club reste compté comme présent ` +
    `jusqu'à son élimination — être reversé de la Ligue des champions vers la Ligue Europa, ou de la Ligue ` +
    `Europa vers la Ligue Conference, n'est pas une élimination.<br>` +
    `<b>Données :</b> SportMonks. Les quatre saisons closes reprennent les coefficients définitifs de l'UEFA ; ` +
    `la saison ${FR(DATA.liveSeason)} est recalculée à chaque mise à jour. Cliquez sur une ligne pour le détail club par club. ` +
    `Mis à jour le ${stamp}.`;
}

document.getElementById("q").addEventListener("input", () => { openCode = null; render(); });
document.getElementById("btn-all").addEventListener("click", () => setTop(false));
document.getElementById("btn-top").addEventListener("click", () => setTop(true));
function setTop(v) {
  topOnly = v;
  document.getElementById("btn-all").setAttribute("aria-pressed", String(!v));
  document.getElementById("btn-top").setAttribute("aria-pressed", String(v));
  render();
}

fetch("ranking.json", { cache: "no-store" })
  .then((r) => r.json())
  .then((json) => { DATA = json; renderHeader(); render(); })
  .catch(() => {
    document.getElementById("tbody").innerHTML =
      '<tr><td class="empty">Données indisponibles. Lancez <code>node fetch-data.js</code> pour générer ranking.json.</td></tr>';
  });
</script>
</body>
</html>
