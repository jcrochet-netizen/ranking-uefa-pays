<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Page destinee a etre embarquee en iframe dans un article : on empeche
     l'URL nue d'etre indexee, pour qu'elle ne concurrence pas l'article qui
     la porte. `follow` laisse tout de meme circuler le jus des liens. -->
<meta name="robots" content="noindex, follow">
<meta name="description" content="Ranking da UEFA por federação em cinco temporadas, calculado a partir dos resultados dos clubes na Champions League, Europa League e Conference League.">
<title>Ranking da UEFA por país</title>
<style>
:root {
  --bg: #0c1520;
  --surface: #14202e;
  --surface-alt: #1a2a3a;
  --surface-hover: #1f3145;
  --accent: #00e676;
  --accent-dim: rgba(0, 230, 118, 0.15);
  --accent-soft: rgba(0, 230, 118, 0.08);
  --live: #4da3ff;
  --live-dim: rgba(77, 163, 255, 0.13);
  --text: #e4eaf0;
  --text-secondary: #8fa4b8;
  --text-faint: #5e7285;
  --border: #1e3347;
  --border-soft: rgba(255, 255, 255, 0.05);
  --gold: #ffd700;
  --silver: #c0c0c0;
  --bronze: #cd7f32;
  --bar: rgba(0, 230, 118, 0.16);
  --shadow: 0 1px 3px rgba(0, 0, 0, 0.4);
}
@media (prefers-color-scheme: light) {
  :root {
    --bg: #f3f5f8;
    --surface: #ffffff;
    --surface-alt: #eef2f6;
    --surface-hover: #e7edf4;
    --accent: #00894a;
    --accent-dim: rgba(0, 137, 74, 0.12);
    --accent-soft: rgba(0, 137, 74, 0.06);
    --live: #1668c4;
    --live-dim: rgba(22, 104, 196, 0.09);
    --text: #1a2533;
    --text-secondary: #5e7285;
    --text-faint: #8b9cad;
    --border: #dde4ec;
    --border-soft: rgba(0, 0, 0, 0.05);
    --bar: rgba(0, 137, 74, 0.14);
    --shadow: 0 1px 3px rgba(20, 40, 70, 0.09);
  }
}
:root[data-theme="light"] {
  --bg: #f3f5f8; --surface: #ffffff; --surface-alt: #eef2f6; --surface-hover: #e7edf4;
  --accent: #00894a; --accent-dim: rgba(0,137,74,.12); --accent-soft: rgba(0,137,74,.06);
  --live: #1668c4; --live-dim: rgba(22,104,196,.09);
  --text: #1a2533; --text-secondary: #5e7285; --text-faint: #8b9cad;
  --border: #dde4ec; --border-soft: rgba(0,0,0,.05); --bar: rgba(0,137,74,.14);
  --shadow: 0 1px 3px rgba(20,40,70,.09);
}
:root[data-theme="dark"] {
  --bg: #0c1520; --surface: #14202e; --surface-alt: #1a2a3a; --surface-hover: #1f3145;
  --accent: #00e676; --accent-dim: rgba(0,230,118,.15); --accent-soft: rgba(0,230,118,.08);
  --live: #4da3ff; --live-dim: rgba(77,163,255,.13);
  --text: #e4eaf0; --text-secondary: #8fa4b8; --text-faint: #5e7285;
  --border: #1e3347; --border-soft: rgba(255,255,255,.05); --bar: rgba(0,230,118,.16);
  --shadow: 0 1px 3px rgba(0,0,0,.4);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  background: transparent;
  color: var(--text);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  font-variant-numeric: tabular-nums;
}

.widget { max-width: 860px; margin: 0 auto; padding: 12px 14px 30px; }

/* ── Tableau ─────────────────────────────────────────────────────── */

.card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 13px; overflow: hidden; box-shadow: var(--shadow);
  width: fit-content; max-width: 100%; margin: 0 auto;
}
.scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }

table { width: 100%; border-collapse: collapse; font-size: 14px; }

thead th {
  position: sticky; top: 0; z-index: 3;
  background: var(--surface-alt);
  font-size: 10.5px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase;
  color: var(--text-secondary); text-align: right;
  padding: 9px 4px; white-space: nowrap;
  border-bottom: 1px solid var(--border);
}
thead th:first-child, thead th.assoc { text-align: left; }
thead th.sortable { cursor: pointer; user-select: none; transition: color .15s; }
thead th.sortable:hover { color: var(--text); }
thead th .arrow { opacity: .35; font-size: 9px; margin-left: 3px; }
thead th.sortable:hover .arrow { opacity: .7; }
thead th[data-active] { color: var(--accent); }
thead th[data-active] .arrow { opacity: 1; }
thead th.col-live { color: var(--live); }

tbody tr.row { border-bottom: 1px solid var(--border-soft); cursor: pointer; transition: background .12s; }
tbody tr.row:hover { background: var(--surface-hover); }
tbody tr.row.open { background: var(--surface-hover); }
tbody td { padding: 7px 4px; text-align: right; white-space: nowrap; }

.rk {
  width: 46px; text-align: left !important;
  font-weight: 700; font-size: 13px; color: var(--text-faint);
}
.rk .n {
  display: inline-flex; align-items: center; justify-content: center;
  min-width: 23px; height: 23px; border-radius: 6px; padding: 0 5px;
  background: var(--surface-alt); color: var(--text-secondary);
}
tr.t1 .rk .n { background: rgba(255,215,0,.16); color: var(--gold); }
tr.t2 .rk .n, tr.t3 .rk .n, tr.t4 .rk .n, tr.t5 .rk .n { background: var(--accent-dim); color: var(--accent); }

td.assoc { text-align: left !important; }
.who { display: flex; align-items: center; gap: 9px; min-width: 0; }
.who > span:last-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.who img {
  width: 22px; height: 15px; object-fit: cover; border-radius: 2.5px;
  background: var(--surface-alt); flex-shrink: 0;
}
.who .nm { font-weight: 600; }
.chev { color: var(--text-faint); font-size: 10px; transition: transform .18s; display: inline-block; }
tr.open .chev { transform: rotate(90deg); color: var(--accent); }

td.season { color: var(--text-secondary); font-size: 13px; }
td.season.live { color: var(--live); font-weight: 600; background: var(--live-dim); }
th.col-live { background: var(--surface-alt); }

thead th.total { white-space: normal; line-height: 1.25; }
td.total {
  font-weight: 800; font-size: 14.5px; padding-right: 10px;
  background: var(--accent-dim);
}

td.clubs { font-size: 12px; color: var(--text-secondary); }
td.clubs .on { color: var(--accent); font-weight: 700; }

/* ── Panneau de détail ───────────────────────────────────────────── */

tr.detail > td { padding: 0; background: var(--surface-alt); }
.panel { padding: 12px 14px 15px; border-bottom: 1px solid var(--border); }
.panel h3 {
  font-size: 11px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase;
  color: var(--text-secondary); margin-bottom: 9px;
}
.panel h3 span { color: var(--live); }
.clubtable { width: 100%; font-size: 13px; border-collapse: collapse; table-layout: auto; }
/* Détail du club rappelé sous son nom quand les colonnes de chiffres
   intermédiaires disparaissent (mobile). */
.c-meta { display: none; }
.clubtable th {
  font-size: 10px; text-transform: uppercase; letter-spacing: .05em; font-weight: 700;
  color: var(--text-faint); text-align: right; padding: 4px 7px; border-bottom: 1px solid var(--border-soft);
  position: static; background: none;
}
.clubtable th:first-child { text-align: left; }
.clubtable td { padding: 5px 7px; text-align: right; border-bottom: 1px solid var(--border-soft); }
.clubtable td:first-child { text-align: left; font-weight: 500; }
.clubtable tr:last-child td { border-bottom: 0; }
.clubtable .cpts { font-weight: 700; }
.clubtable .waiting { color: var(--text-faint); font-style: italic; }
.tag {
  display: inline-block; font-size: 9.5px; font-weight: 700; letter-spacing: .04em;
  padding: 1.5px 5px; border-radius: 4px; margin-left: 6px; vertical-align: 1px;
}
.tag.UCL { background: rgba(77,163,255,.16); color: var(--live); }
.tag.UEL { background: rgba(255,153,0,.16); color: #ff9f2e; }
.tag.UECL { background: rgba(0,230,118,.14); color: var(--accent); }
.tag.out { background: var(--surface-alt); color: var(--text-faint); }
.clubtable tr.out td:first-child, .clubtable tr.out td { color: var(--text-faint); }
@media (prefers-color-scheme: light) { .tag.UEL { color: #b26b00 } }

.sumline {
  display: flex; flex-wrap: wrap; gap: 14px; margin-top: 10px; padding-top: 9px;
  border-top: 1px solid var(--border-soft); font-size: 12px; color: var(--text-secondary);
}
.sumline b { color: var(--text); font-weight: 700; }

/* ── Pied ────────────────────────────────────────────────────────── */

.foot { margin-top: 14px; font-size: 11.5px; color: var(--text); line-height: 1.6; }
.foot b { color: var(--text); font-weight: 700; }
.legend { display: flex; flex-wrap: wrap; gap: 13px; margin-bottom: 7px; }
.legend i { display: inline-block; width: 9px; height: 9px; border-radius: 3px; margin-right: 5px; vertical-align: 0; }

.empty { padding: 34px 16px; text-align: center; color: var(--text-secondary); font-size: 14px; }

/* ── Compact : on masque les saisons les plus anciennes ──────────── */

/* Les cinq saisons tiennent de front dès ~620 px. En dessous, elles
   s'effacent une à une, la plus ancienne d'abord. */
@media (max-width: 820px) {
  .widget { padding: 10px 10px 26px; }
  table { font-size: 13px; }
  tbody td, thead th { padding: 7px 3px; }
  td.assoc { min-width: 124px; }
}
@media (max-width: 660px) { .hideable-1 { display: none } }
@media (max-width: 560px) { .hideable-2 { display: none } }
@media (max-width: 500px) {
  .hideable-3 { display: none }
  .who img { width: 19px; height: 13px }
  .who { gap: 7px }
  /* Sur les écrans les plus étroits, la saison en cours et le total doivent
     rester lisibles sans défilement. C'est l'intitulé « Association » qui
     imposait jusqu'ici la largeur de la colonne. */
  /* Mise en page automatique : avec des intitulés courts (« 26/27 ») tout
     tient sans défilement. Un `table-layout: fixed` réserverait au contraire
     de la place pour les colonnes masquées. */
  td.assoc, thead th.assoc { min-width: 0; }
  thead th.assoc { letter-spacing: 0; font-size: 9.5px; }
  td.total { font-size: 13.5px; padding-right: 9px; }
  .rk { width: 34px }
  .rk .n { min-width: 20px; height: 20px; font-size: 12px }
}
@media (max-width: 420px) {
  .hideable-4 { display: none }
  /* Marge de manoeuvre supplementaire sur les tres petits ecrans, pour que le
     total reste entier plutot que rogne. */
  table { font-size: 12.5px; }
  td.total { font-size: 13px; padding-right: 7px; }
  .rk { width: 30px }
  .rk .n { min-width: 18px; height: 18px; font-size: 11px }
}

/* Embarque en iframe, la largeur utile est celle de la colonne de l'article,
   deja marginee : le widget n'ajoute donc pas la sienne sur petit ecran. */
@media (max-width: 560px) {
  .embedded .widget { padding-left: 0; padding-right: 0; }
}

/* Tableau de détail : sur mobile on ne garde que le club et son total, les
   chiffres intermédiaires passent en sous-titre. */
@media (max-width: 560px) {
  .clubtable .c-matches, .clubtable .c-mpts, .clubtable .c-bonus { display: none; }
  .clubtable td:first-child { white-space: normal; }
  .c-meta {
    display: block; font-size: 11px; color: var(--text-faint);
    font-weight: 400; margin-top: 1px;
  }
  .panel { padding: 10px 10px 13px; }
  .clubtable th, .clubtable td { padding: 6px 5px; }
  .clubtable td.cpts { font-size: 14px; }
  .sumline { gap: 10px; font-size: 11.5px; }
}
</style>
</head>
<body>
<div class="widget">
  <div class="card">
    <div class="scroll">
      <table>
        <thead><tr id="thead"></tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </div>

  <div class="foot">
    <div class="legend">
      <span><i style="background:rgba(255,215,0,.5)"></i>1<sup>o</sup></span>
      <span><i style="background:var(--accent)"></i>Top 5</span>
      <span><i style="background:var(--live)"></i>Temporada em curso, recalculada ao vivo</span>
    </div>
    <div id="method"></div>
  </div>
</div>

<script>
const LANG = "pt";
const LOCALE = "pt-BR";
const nameOf = (row) => (row.names && row.names[LANG]) || row.name;

const F3 = (v) => (v || 0).toFixed(3);
// Prose : « 2022-23 ». En-tête de colonne : « 22/23 », pour tenir les cinq
// saisons de front sans élargir le tableau.
const FR = (s) => s.replace("/", "-");
const SEA = (s) => s.slice(2);

let DATA = null;
let sortKey = "total";
let sortDir = -1;
let openCode = null;

/* Colonnes : les saisons closes sont masquées en premier sur petit écran,
   la plus ancienne d'abord. */
function columns() {
  // La saison en cours et le total restent toujours visibles. Les saisons
  // closes s'effacent au fur et à mesure, la plus ancienne d'abord.
  const closed = DATA.seasons.filter((s) => s !== DATA.liveSeason);
  const steps = ["hideable-1", "hideable-1", "hideable-2", "hideable-3"];
  const hideOf = new Map(
    closed.map((s, i) => [s, steps[Math.min(i, steps.length - 1)]])
  );

  const cols = [
    { key: "rank", label: "#", cls: "rk", sortable: false },
    { key: "name", label: "Federação", cls: "assoc", sortable: true },
  ];
  for (const s of DATA.seasons) {
    const live = s === DATA.liveSeason;
    const hide = live ? "" : hideOf.get(s) || "";
    cols.push({
      key: "s:" + s,
      label: SEA(s),
      cls: "season" + (live ? " live" : ""),
      thCls: live ? "col-live" : hide,
      hide,
      sortable: true,
    });
  }
  // Libellé dérivé de la fenêtre en cours : « Total 22-27 » aujourd'hui,
  // « Total 23-28 » l'an prochain, sans intervention.
  const span = `${DATA.seasons[0].slice(2, 4)}-${DATA.liveSeason.slice(5)}`;
  cols.push({ key: "total", label: `Total ${span}`, cls: "total", sortable: true });
  cols.push({
    key: "clubsAlive",
    label: "Clubes",
    cls: "clubs",
    thCls: "hideable-4",
    hide: "hideable-4",
    title: "Clubes ainda na disputa sobre clubes inscritos",
    sortable: true,
  });
  return cols;
}

function valueOf(row, key) {
  if (key === "name") return nameOf(row);
  if (key.startsWith("s:")) return row.coefs[key.slice(2)] || 0;
  return row[key] ?? 0;
}

// Le classement est toujours affiché en entier ; seul l'ordre des colonnes
// peut changer, au clic sur un en-tête.
function sorted() {
  return [...DATA.rows].sort((a, b) => {
    const x = valueOf(a, sortKey), y = valueOf(b, sortKey);
    const c = typeof x === "string" ? x.localeCompare(y, LOCALE) : x - y;
    return c * sortDir || a.rank - b.rank;
  });
}

function renderHead() {
  const tr = document.getElementById("thead");
  tr.innerHTML = "";
  for (const c of columns()) {
    const th = document.createElement("th");
    th.className = [c.cls.split(" ")[0] === "rk" ? "" : c.cls.split(" ")[0], c.thCls || ""].filter(Boolean).join(" ");
    if (c.cls.startsWith("assoc")) th.classList.add("assoc");
    th.textContent = c.label;
    if (c.title) th.title = c.title;
    if (c.sortable) {
      th.classList.add("sortable");
      th.tabIndex = 0;
      th.setAttribute("role", "button");
      if (sortKey === c.key) th.dataset.active = "1";
      const active = sortKey === c.key;
      const arrow = document.createElement("span");
      arrow.className = "arrow";
      arrow.textContent = active ? (sortDir === -1 ? "▼" : "▲") : "⇅";
      th.appendChild(arrow);
      th.title = c.key === "name"
        ? (active && sortDir === 1 ? "Ordenar de Z a A" : "Ordenar de A a Z")
        : (active && sortDir === -1 ? "Ordenar do menor para o maior" : "Ordenar do maior para o menor");
      const go = () => {
        if (sortKey === c.key) sortDir *= -1;
        else { sortKey = c.key; sortDir = c.key === "name" ? 1 : -1; }
        openCode = null;
        render();
      };
      th.addEventListener("click", go);
      th.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); go(); } });
    }
    tr.appendChild(th);
  }
}

function clubRows(row) {
  if (!row.detail.length) return '<tr><td colspan="5" class="waiting">Nenhum clube inscrito nesta temporada.</td></tr>';
  return row.detail
    .map((c) => {
      const notStarted = c.played === 0;
      const mpts = notStarted ? "—" : F3(c.matchPts).replace(/\.?0+$/, "") || "0";
      const bonus = c.bonus ? F3(c.bonus).replace(/\.?0+$/, "") : "—";
      // Sur mobile seules les colonnes Club et Total restent : le reste est
      // rappelé en petit sous le nom du club.
      const meta = notStarted
        ? "ainda na disputa"
        : `${c.played} match${c.played > 1 ? "es" : ""} · ${mpts} pt${Number(mpts) > 1 ? "s" : ""}` +
          (c.bonus ? ` · bonus ${bonus}` : "");
      return `<tr${c.alive ? "" : ' class="out"'}>
        <td>${esc(c.name)}${c.comp ? `<span class="tag ${c.comp.split("+")[0]}">${c.comp}</span>` : ""}${
        c.alive ? "" : '<span class="tag out">eliminado</span>'
      }<span class="c-meta">${meta}</span></td>
        <td class="c-matches">${notStarted ? '<span class="waiting">ainda na disputa</span>' : c.played}</td>
        <td class="c-mpts">${mpts}</td>
        <td class="c-bonus">${bonus}</td>
        <td class="cpts">${F3(c.pts).replace(/\.?0+$/, "") || "0"}</td>
      </tr>`;
    })
    .join("");
}

function esc(s) {
  return String(s).replace(/[&<>"]/g, (m) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[m]));
}

function render() {
  renderHead();
  const cols = columns();
  const tb = document.getElementById("tbody");
  const rows = sorted();
  tb.innerHTML = "";

  if (!rows.length) {
    tb.innerHTML = `<tr><td colspan="${cols.length}" class="empty">Nenhuma federação corresponde a esta busca.</td></tr>`;
    return;
  }

  for (const row of rows) {
    const tr = document.createElement("tr");
    tr.className = "row" + (row.rank <= 5 ? " t" + row.rank : "") + (openCode === row.code ? " open" : "");
    tr.tabIndex = 0;
    tr.setAttribute("role", "button");
    tr.setAttribute("aria-expanded", openCode === row.code ? "true" : "false");

    let html = "";
    for (const c of cols) {
      const hide = c.hide ? " " + c.hide : "";
      if (c.key === "rank") {
        html += `<td class="rk${hide}"><span class="n">${row.rank}</span></td>`;
      } else if (c.key === "name") {
        html += `<td class="assoc${hide}"><div class="who">
          <span class="chev">▶</span>
          <img src="${row.flag}" alt="" loading="lazy" width="22" height="15">
          <span class="nm">${esc(nameOf(row))}</span>
        </div></td>`;
      } else if (c.key.startsWith("s:")) {
        const s = c.key.slice(2);
        const live = s === DATA.liveSeason;
        html += `<td class="season${live ? " live" : ""}${hide}">${F3(row.coefs[s])}</td>`;
      } else if (c.key === "total") {
        html += `<td class="total${hide}">${F3(row.total)}</td>`;
      } else {
        html += `<td class="clubs${hide}"><span class="on">${row.clubsAlive}</span>/${row.clubs}</td>`;
      }
    }
    tr.innerHTML = html;

    const toggle = () => {
      openCode = openCode === row.code ? null : row.code;
      render();
    };
    tr.addEventListener("click", toggle);
    tr.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggle(); } });
    tb.appendChild(tr);

    if (openCode === row.code) {
      const d = document.createElement("tr");
      d.className = "detail";
      const live = row.coefs[DATA.liveSeason] || 0;
      const pts = row.detail.reduce((s, c) => s + c.pts, 0);
      d.innerHTML = `<td colspan="${cols.length}"><div class="panel">
        <h3>Detalhe <span>${FR(DATA.liveSeason)}</span> — ${esc(nameOf(row))}</h3>
        <table class="clubtable">
          <thead><tr><th>Clube</th><th class="c-matches">Jogos</th><th class="c-mpts">Pts de jogo</th><th class="c-bonus">Bonus</th><th>Total</th></tr></thead>
          <tbody>${clubRows(row)}</tbody>
        </table>
        <div class="sumline">
          <span>Total de pontos: <b>${F3(pts).replace(/\.?0+$/, "") || "0"}</b></span>
          <span>Clubes inscritos: <b>${row.clubs}</b></span>
          <span>Coeficiente ${FR(DATA.liveSeason)}: <b>${F3(live)}</b></span>
        </div>
      </div></td>`;
      tb.appendChild(d);
    }
  }

  if (window.parent !== window) postHeight();
}

function renderFoot() {
  const d = new Date(DATA.updated);
  const stamp = d.toLocaleDateString(LOCALE, { day: "numeric", month: "long", year: "numeric" }) +
    " às " + d.toLocaleTimeString(LOCALE, { hour: "2-digit", minute: "2-digit" });
  document.getElementById("method").innerHTML =
    `<b>Como é calculado:</b> 2 pontos por vitória e 1 por empate (metade nas fases de qualificação e nos playoffs de verão), ` +
    `mais os bônus da UEFA pela posição na fase de liga e por cada fase alcançada a partir das oitavas. ` +
    `O total é dividido pelo número de clubes inscritos e truncado em três casas decimais. ` +
    `Os pênaltis não dão pontos, mas a classificação que eles garantem dá direito ao bônus de fase.<br>` +
    `<b>Dados:</b> SportMonks. As quatro temporadas encerradas usam os coeficientes definitivos da UEFA; ` +
    `a temporada ${FR(DATA.liveSeason)} é recalculada a cada atualização. Clique em uma linha para o detalhe clube a clube. ` +
    `Dados atualizados em ${stamp}.`;
}

/* ── Intégration en iframe ───────────────────────────────────────────
 * `?theme=light` ou `?theme=dark` force l'apparence, pour s'accorder à
 * l'article hôte plutôt que de suivre les préférences du visiteur.
 */
if (window.parent !== window) document.documentElement.classList.add("embedded");

const forcedTheme = new URLSearchParams(location.search).get("theme");
if (forcedTheme === "light" || forcedTheme === "dark") {
  document.documentElement.setAttribute("data-theme", forcedTheme);
}

/* La page parente ne peut pas mesurer le contenu d'une iframe : on lui
 * envoie la hauteur à chaque changement, pour qu'elle ajuste le cadre et
 * qu'il n'y ait ni barre de défilement imbriquée ni tableau tronqué. */
let lastHeight = 0;
function postHeight() {
  // On mesure le conteneur du widget, et non l'élément racine : la hauteur de
  // ce dernier suit celle du cadre, si bien que la valeur initiale ferait
  // plancher et que le cadre ne pourrait plus se resserrer.
  if (!DATA) return; // avant les données le widget est vide : hauteur non représentative
  const box = document.querySelector(".widget");
  const h = Math.ceil(box ? box.getBoundingClientRect().height : document.body.scrollHeight);
  if (!h || Math.abs(h - lastHeight) < 2) return;
  lastHeight = h;
  parent.postMessage({ type: "uefa-ranking:height", height: h }, "*");
}
if (window.parent !== window) {
  // Trois filets : l'observateur de taille, un contrôle périodique, et le
  // redimensionnement de la fenêtre. Le premier suffit dans un navigateur
  // classique, mais il reste muet quand le cadre est mis en veille par le
  // navigateur — d'où le contrôle périodique, qui, lui, aboutit toujours.
  try {
    new ResizeObserver(postHeight).observe(document.querySelector(".widget") || document.body);
  } catch {
    /* navigateur sans ResizeObserver : le contrôle périodique prend le relais */
  }
  window.addEventListener("load", postHeight);
  window.addEventListener("resize", postHeight);
  setInterval(postHeight, 500);
}

fetch("ranking.json", { cache: "no-store" })
  .then((r) => r.json())
  .then((json) => { DATA = json; renderFoot(); render(); })
  .catch(() => {
    document.getElementById("tbody").innerHTML =
      '<tr><td class="empty">Dados indisponíveis. Execute <code>node fetch-data.js</code> para gerar ranking.json.</td></tr>';
  });
</script>
</body>
</html>
